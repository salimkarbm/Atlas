name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Architecture
        run: npm run depcruise

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency Analysis
        run: npm run knip

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
